    <script type="module">
      import { app, auth, firestore } from '/src/app.js';
      import { onAuthStateChanged } from 'firebase/auth';
      import { doc, getDoc } from 'firebase/firestore';
      
      // Moyasar API keys are managed server-side in Cloud Functions.
      // - Live public key: pk_live_1radgsTB5f1igMJGj6QFXj7VJTEyD4ATQueN3PqS
      // - Live secret key: Set via `firebase functions:secrets:set MOYASAR_SECRET_KEY`
      // The client never handles secret keys directly for security.
      
      // Parse URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const planName = urlParams.get('plan') || '6 Months';
      const amount = parseFloat(urlParams.get('amount') || '549');
      
      // Map plan names to Arabic labels
      const planLabels = {
        '1 Month': 'اشتراك شهر واحد',
        '3 Months': 'اشتراك 3 شهور',
        '6 Months': 'اشتراك 6 شهور',
        '12 Months': '12 شهر'
      };

      const displayName = planLabels[planName] || planName;
      
      // Update UI with plan details
      document.getElementById('plan-name').textContent = displayName;
      document.getElementById('plan-amount').innerHTML = `${amount} <span>ريال</span>`;

      
      // Update button text with correct amount
      const payBtn = document.getElementById('pay-now-btn');
      if (payBtn) {
        payBtn.textContent = `ادفع الآن ${amount} ريال`;
      }
      
      // Wait for auth state before initializing payment
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          // Show login prompt with redirect back to checkout after login
          document.getElementById('payment-action').innerHTML = `
            <div class="text-center py-8">
              <div class="mb-4">
                <svg class="w-12 h-12 mx-auto text-[#D4AF37]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <p class="text-slate-300 mb-2 font-semibold">يجب تسجيل الدخول لإتمام الدفع</p>
              <p class="text-slate-400 text-sm mb-6">سجل دخولك للمتابعة وإتمام عملية الشراء بأمان</p>
              <a href="/index.html#login" onclick="sessionStorage.setItem('cameFromCheckout', 'true')" class="inline-block bg-[#D4AF37] text-slate-900 font-bold py-3 px-8 rounded-xl hover:bg-[#B8941F] transition-colors shadow-lg hover:shadow-xl">
                تسجيل الدخول
              </a>
              <p class="text-slate-500 text-xs mt-4">بعد تسجيل الدخول، ستعود تلقائياً إلى صفحة الدفع</p>
            </div>
          `;
          return;
        }
        
        // Check if user is already premium
        try {
          const userRef = doc(firestore, 'users', user.uid);
          const userSnap = await getDoc(userRef);
          if (userSnap.exists()) {
            const userData = userSnap.data();
            if (userData.isPremium === true) {
              document.getElementById('payment-action').innerHTML = `
                <div class="text-center py-8">
                  <div class="mb-4">
                    <svg class="w-12 h-12 mx-auto text-accent-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                  </div>
                  <p class="text-slate-300 mb-2 font-semibold">أنت بالفعل مشترك مميز</p>
                  <p class="text-slate-400 text-sm mb-6">لا حاجة للدفع، يمكنك الاستمتاع بجميع الميزات المميزة</p>
                  <button onclick="window.location.href='/'" class="inline-block bg-[#D4AF37] text-slate-900 font-bold py-3 px-8 rounded-xl hover:bg-[#B8941F] transition-colors">
                    العودة إلى الصفحة الرئيسية
                  </button>
                </div>
              `;
              return;
            }
          }
        } catch (e) {
          console.warn('[Checkout] Failed to check premium status:', e);
        }
        
        // Store user ID for payment verification
        window.currentUserId = user.uid;
        
        // Add click event to payment button
        const payBtn = document.getElementById('pay-now-btn');
        payBtn.addEventListener('click', async () => {
          try {
            console.log('[Checkout] Creating hosted payment page for user:', user.uid);
            
            // Show loading state
            document.getElementById('payment-action').innerHTML = `
              <div class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-[#D4AF37] mb-4"></div>
                <p class="text-slate-300">جاري تحضير صفحة الدفع...</p>
              </div>
            `;
            
            // Get user's ID token for authentication
            const idToken = await user.getIdToken();
            
            // Call Cloud Function using HTTP fetch (onRequest endpoint)
            const functionUrl = 'https://us-central1-smle-mock-exam-51478532-5ae31.cloudfunctions.net/createPayment';
            
            const response = await fetch(functionUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${idToken}`
              },
              body: JSON.stringify({
                amount: amount * 100, // Amount in halalas
                currency: 'SAR',
                description: `اشتراك SMLE Pro - ${planName} - UID:${user.uid}`,
                userId: user.uid,
                returnUrl: window.location.origin + '/success.html'
              })
            });
            
            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`HTTP ${response.status}: ${errorText}`);
            }
            
            const data = await response.json();
            
            if (data.url) {
              // Store invoice ID for later verification
              sessionStorage.setItem('pendingInvoiceId', data.paymentId || data.invoiceId);
              sessionStorage.setItem('pendingInvoiceUserId', user.uid);
              
              // Redirect to Moyasar hosted payment page
              window.location.href = data.url;
            } else {
              throw new Error('No payment URL received');
            }
            
          } catch (error) {
            console.error('Payment creation error:', error);
            
            // Get user-friendly error message
            let errorMsg = 'حدث خطأ غير متوقع';
            if (error.code === 'functions/unavailable') {
              errorMsg = 'خدمة الدفع غير متاحة حالياً. يرجى المحاولة لاحقاً.';
            } else if (error.code === 'functions/permission-denied') {
              errorMsg = 'يجب تسجيل الدخول لإتمام الدفع.';
            } else if (error.code === 'functions/invalid-argument') {
              errorMsg = 'بيانات الدفع غير صحيحة. يرجى المحاولة مرة أخرى.';
            } else if (error.message) {
              errorMsg = error.message;
            }
            
            document.getElementById('payment-action').innerHTML = `
              <div class="text-center py-8">
                <div class="mb-4">
                  <svg class="w-12 h-12 mx-auto text-accent-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <p class="text-slate-300 mb-2 font-semibold">حدث خطأ في تحضير صفحة الدفع</p>
                <p class="text-slate-400 text-sm mb-6">${errorMsg}</p>
                <div class="flex gap-3 justify-center">
                  <button onclick="location.reload()" class="inline-block bg-[#D4AF37] text-slate-900 font-bold py-3 px-8 rounded-xl hover:bg-[#B8941F] transition-colors">
                    إعادة التحميل
                  </button>
                  <button onclick="window.location.href='/'" class="inline-block bg-background-dark border border-border-dark text-slate-300 font-semibold py-3 px-8 rounded-xl hover:border-primary hover:text-primary transition-all">
                    العودة للرئيسية
                  </button>
                </div>
              </div>
            `;
          }
        });
      });
    </script>
