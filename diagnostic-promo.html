        if (w < 10) return;
        el.innerHTML = '<div class="preview-wrap" style="transform:scale(' + (w/1080) + ');">' + renderScene(i) + '</div>';

    function pollPreviews() {

      var done = true;
      SCENES.forEach(function(s, i) {
        var el = document.getElementById('preview-' + i);
        if (!el || el.children.length === 0 || el.clientWidth < 10) done = false;

    /* ══ Capture & export ══ */
    async function captureScene(idx) {
      if (window.__html2canvasReady) await window.__html2canvasReady;
      if (typeof window.html2canvas !== 'function') throw new Error('html2canvas not loaded');
      /* FLAT render for html2canvas (no z-index/absolute/gradient issues) */
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;';
      div.innerHTML = renderFlat(idx);
      document.body.appendChild(div);
      await new Promise(function(r) { setTimeout(r, 1000); }); /* fonts */
      var canvas = await window.html2canvas(div, { width:1080, height:1920, scale:1.5, useCORS:true, allowTaint:true, backgroundColor:'#0a0f1a', logging:false });
      document.body.removeChild(div);
      var crop = document.createElement('canvas');
      crop.width = 1080; crop.height = 1920;
      var ctx = crop.getContext('2d');
      ctx.drawImage(canvas, 0, 0, 1080, 1920);
      var blob = await new Promise(function(r) { crop.toBlob(r, 'image/png'); });
      return { blob:blob, name:SCENES[idx].name };
    }

    async function dl(idx) {
      try {
        var r = await captureScene(idx);
        var u = URL.createObjectURL(r.blob);
        var a = document.createElement('a');
        a.href = u; a.download = 'smle-diagnostic-' + r.name.toLowerCase() + '.png'; a.click();
        URL.revokeObjectURL(u);
        document.getElementById('status-bar').textContent = '✅ Downloaded: ' + r.name + '!';
      } catch(e) { document.getElementById('status-bar').textContent = '❌ ' + e.message; console.error(e); }
    }

    async function exportScene(idx) {
      var btn = document.getElementById('export-all-btn');
      btn.disabled = true;
      await dl(idx);
      btn.disabled = false;
    }

    document.getElementById('export-all-btn').addEventListener('click', async function() {
      var btn = this; btn.disabled = true;
      var st = document.getElementById('status-bar');
      for (var i = 0; i < SCENES.length; i++) {
        st.textContent = '⏳ ' + (i+1) + '/' + SCENES.length + ': ' + SCENES[i].name + '...';
        try { await dl(i); await new Promise(function(r) { setTimeout(r,300); }); }
        catch(e) { st.textContent = '⚠️ ' + (i+1) + ' failed: ' + e.message; }
      }
      st.textContent = '✅ All 6 scenes downloaded!';
      btn.disabled = false;
    });
