<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02060c"/>
      <stop offset="50%" stop-color="#0a1620"/>
      <stop offset="100%" stop-color="#101f22"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.18)"/>
