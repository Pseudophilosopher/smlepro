<!doctype html>
<html lang="ar" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMLE Pro | نجاح الدفع</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G2S4QENDZ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-G2S4QENDZ0');
    </script>
    <style>
      .success-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: white;
        margin: 0 auto;
        animation: scaleIn 0.5s ease-out;
      }
      @keyframes scaleIn {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #334155;
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <main class="flex min-h-screen items-center justify-center p-4">
      <section class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 text-center shadow-2xl">
        <!-- Loading State -->
        <div id="loading-state">
          <div class="loading-spinner"></div>
          <h1 class="mt-6 text-2xl font-bold text-white">جاري التحقق من الدفع...</h1>
          <p id="status-message" class="mt-3 text-slate-400">يرجى الانتظار بينما نتحقق من حالة الدفع</p>
        </div>

        <!-- Success State -->
        <div id="success-state" class="hidden">
          <div class="success-icon">✓</div>
          <h1 class="mt-6 text-3xl font-bold text-white">تم الاشتراك بنجاح!</h1>
          <p id="success-message" class="mt-3 text-slate-300">مرحباً بك في SMLE Pro. حسابك الآن مميز!</p>
          <div id="plan-details" class="mt-6 p-4 bg-slate-800 rounded-xl">
            <p class="text-sm text-slate-400">الخطة: <span id="confirmed-plan" class="text-white font-semibold">6 أشهر</span></p>
          </div>
          <a
            id="dashboard-btn"
            href="/index.html"
            class="mt-6 inline-flex items-center justify-center rounded-lg bg-[#D4AF37] px-8 py-3 font-bold text-slate-900 transition hover:bg-[#B8941F]"
          >
            ابدأ الدراسة الآن
          </a>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden">
          <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-900/50 text-3xl text-red-500">!</div>
          <h1 class="mt-6 text-2xl font-bold text-white">حدث خطأ</h1>
          <p id="error-message" class="mt-3 text-slate-400">لم نتمكن من التحقق من الدفع</p>
          <a
            href="/index.html#pricing"
            class="mt-6 inline-flex items-center justify-center rounded-lg bg-slate-700 px-6 py-3 font-semibold text-white transition hover:bg-slate-600"
          >
            العودة للصفحة الرئيسية
          </a>
        </div>

        <!-- Footer Links -->
        <div class="mt-8 flex flex-wrap justify-center gap-x-5 gap-y-2 text-center text-xs font-semibold text-slate-500">
          <a href="/" class="text-blue-400 hover:underline">الرئيسية</a>
          <a href="/legal.html#privacy" class="text-blue-400 hover:underline">الخصوصية</a>
          <a href="/legal.html#terms" class="text-blue-400 hover:underline">الشروط</a>
          <a href="/legal.html#refunds" class="text-blue-400 hover:underline">الاسترداد</a>
        </div>
      </section>
    </main>

    <script type="module">
      import { app, auth } from '/src/app.js';
      import { onAuthStateChanged } from 'firebase/auth';
      import { getFunctions, httpsCallable } from 'firebase/functions';

      document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        // Moyasar callback format: ?status={status}&id={id}
        let paymentId = urlParams.get('id');
        const paymentStatus = urlParams.get('status');
        
        const loadingState = document.getElementById('loading-state');
        const successState = document.getElementById('success-state');
        const errorState = document.getElementById('error-state');
        const statusMessage = document.getElementById('status-message');
        const errorMessage = document.getElementById('error-message');
        const dashboardBtn = document.getElementById('dashboard-btn');
        const confirmedPlan = document.getElementById('confirmed-plan');

        // Fallback: if no paymentId in URL, check sessionStorage for pending invoice
        if (!paymentId) {
          const pendingInvoiceId = sessionStorage.getItem('pendingInvoiceId');
          const pendingUserId = sessionStorage.getItem('pendingInvoiceUserId');
          if (pendingInvoiceId && pendingUserId) {
            // We have a pending invoice — try to verify it directly
            paymentId = pendingInvoiceId;
            statusMessage.textContent = 'جاري التحقق من الدفع المسبق...';
          } else {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorMessage.textContent = 'رقم الدفع غير موجود. يرجى المحاولة مرة أخرى.';
            return;
          }
        }

        // Check if payment was successful (only if we have a status param)
        if (paymentStatus && paymentStatus !== 'paid') {
          loadingState.classList.add('hidden');
          errorState.classList.remove('hidden');
          errorMessage.textContent = 'لم تكتمل عملية الدفع بنجاح. الحالة: ' + paymentStatus;
          return;
        }

        // Wait for auth state
        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorMessage.textContent = 'يجب تسجيل الدخول للتحقق من الدفع.';
            return;
          }

          // Retry logic: try verification up to 5 times with delays
          // (webhook may take a few seconds to process)
          let lastError = null;
          for (let attempt = 1; attempt <= 5; attempt++) {
            try {
              // Call the verification Cloud Function
              const functions = getFunctions(app, 'us-central1');
              const verifyPayment = httpsCallable(functions, 'verifyMoyasarPayment');
              const result = await verifyPayment({ paymentId });
              const response = result.data || {};

              if (response.ok) {
                // Success! Show success state
                loadingState.classList.add('hidden');
                successState.classList.remove('hidden');

                // Try to get plan name from sessionStorage
                const savedPlan = sessionStorage.getItem('selectedPlan');
                if (savedPlan) {
                  confirmedPlan.textContent = savedPlan;
                } else {
                  confirmedPlan.textContent = 'Pro';
                }

                // Clean up sessionStorage
                sessionStorage.removeItem('pendingInvoiceId');
                sessionStorage.removeItem('pendingInvoiceUserId');
                sessionStorage.removeItem('selectedPlan');
                sessionStorage.removeItem('selectedAmount');
                sessionStorage.removeItem('cameFromCheckout');

                // Show dashboard button
                dashboardBtn.style.display = 'inline-flex';
                
                // Auto-redirect to dashboard after 3 seconds
                setTimeout(() => {
                  window.location.href = '/';
                }, 3000);
                return; // Exit retry loop on success
              }

              lastError = new Error('Verification returned not ok');
            } catch (error) {
              lastError = error;
              console.warn(`Payment verification attempt ${attempt}/5 failed:`, error);
              
              // Wait before retrying (exponential backoff)
              if (attempt < 5) {
                await new Promise(r => setTimeout(r, attempt * 2000));
              }
            }
          }

          // All attempts failed
          console.error("Payment verification failed after 5 attempts:", lastError);
          loadingState.classList.add('hidden');
          errorState.classList.remove('hidden');
          
          if (lastError?.code === 'functions/permission-denied') {
            errorMessage.textContent = 'هذا الدفع مرتبط بحساب آخر.';
          } else if (lastError?.code === 'functions/failed-precondition') {
            errorMessage.textContent = 'حالة الدفع غير صالحة. يرجى التواصل مع الدعم.';
          } else {
            errorMessage.textContent = 'حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى أو التواصل مع الدعم.';
          }
        });
      });
    </script>
  </body>
</html>
