<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101f22">
  <meta name="robots" content="noindex, nofollow">
  <title>SMLE Pro — Instant feedback recording demo</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G2S4QENDZ0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-G2S4QENDZ0');
  </script>
</head>
<body class="min-h-[100dvh] min-h-screen bg-background-dark font-display text-slate-200 antialiased pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">

  <div id="demo-controls" class="border-b border-border-dark bg-surface-dark/90 px-3 py-4 sm:px-4 sm:py-3">
    <div class="max-w-7xl mx-auto flex flex-col gap-4 sm:flex-row sm:flex-wrap sm:items-center sm:gap-4 text-sm sm:text-sm">
      <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-stretch w-full sm:w-auto">
        <button type="button" id="btn-play" class="touch-manipulation min-h-[48px] w-full sm:w-auto rounded-xl bg-primary px-6 py-3 text-base font-bold text-background-dark shadow-glow-primary hover:brightness-110 active:scale-[0.98] transition-transform">
          Play / restart
        </button>
        <button type="button" id="btn-change-question" class="touch-manipulation min-h-[48px] w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl border border-primary/60 bg-background-dark px-5 py-3 text-base font-bold text-primary hover:bg-primary/10 active:scale-[0.98] transition-transform">
          <span class="material-symbols-outlined text-[22px]">swap_horiz</span>
          <span id="btn-change-question-label">Change (1/3)</span>
        </button>
      </div>
      <label class="flex flex-wrap items-center gap-x-2 gap-y-1 text-slate-300 min-h-[44px] sm:min-h-0">
        <span class="text-slate-500 shrink-0">Wait</span>
        <input id="inp-wait" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="30" value="4" class="min-h-[44px] w-20 rounded-lg bg-background-dark border border-border-dark px-3 py-2 text-base text-white touch-manipulation">
        <span class="text-slate-500">s (auto)</span>
      </label>
      <label class="flex flex-wrap items-center gap-x-2 gap-y-1 text-slate-300 min-h-[44px] sm:min-h-0">
        <span class="text-slate-500 shrink-0">Wrong</span>
        <select id="inp-wrong" class="min-h-[44px] min-w-[4.5rem] rounded-lg bg-background-dark border border-border-dark px-3 py-2 text-base text-white touch-manipulation">
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="A">A (correct)</option>
        </select>
      </label>
      <label class="flex items-start gap-3 cursor-pointer text-slate-300 py-1 touch-manipulation min-h-[44px] sm:min-h-0 sm:items-center">
        <input type="checkbox" id="chk-manual" class="mt-1 size-5 shrink-0 rounded border-border-dark sm:mt-0 touch-manipulation">
        <span class="text-base leading-snug sm:text-sm">Tap an option yourself (real finger in frame)</span>
      </label>
      <label class="flex items-start gap-3 cursor-pointer text-slate-300 py-1 touch-manipulation min-h-[44px] sm:min-h-0 sm:items-center">
        <input type="checkbox" id="chk-fake-cursor" class="mt-1 size-5 shrink-0 rounded border-border-dark sm:mt-0 touch-manipulation" checked>
        <span class="text-base leading-snug sm:text-sm">Fake pointer glide (auto only)</span>
      </label>
      <span class="hidden text-slate-500 text-sm sm:ms-auto sm:inline">Space = restart (keyboard)</span>
    </div>
    <p class="max-w-7xl mx-auto mt-3 text-xs text-slate-500 leading-relaxed hidden sm:block">
      URL: <code class="text-primary">?clean=1</code> hides this bar (phone: <strong class="text-slate-400">Replay</strong> button) · <code class="text-primary">?manual=1</code> · <code class="text-primary">?nocursor=1</code> · <code class="text-primary">?wait=5&amp;wrong=C</code> · <code class="text-primary">?autostart=1</code>
    </p>
  </div>

  <div id="demo-root" class="max-w-7xl mx-auto w-full px-0 sm:px-0"></div>

  <!-- Shown when ?clean=1 so phones can restart without a keyboard -->
  <button type="button" id="demo-fab-restart" class="hidden fixed z-[100] items-center justify-center gap-2 rounded-full bg-primary min-h-[52px] min-w-[52px] px-5 py-3 text-background-dark font-bold shadow-depth shadow-glow-primary touch-manipulation active:scale-95 transition-transform end-[max(0.75rem,env(safe-area-inset-right))] bottom-[max(1rem,env(safe-area-inset-bottom))]" aria-label="Play again">
    <span class="material-symbols-outlined text-[26px]">replay</span>
    <span class="text-sm font-black tracking-tight">Again</span>
  </button>

  <script type="module" src="/src/demo-instant-feedback.js"></script>
</body>
</html>
